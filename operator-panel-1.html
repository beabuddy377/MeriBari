<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeriBari — Doctor Panel</title>

<style>
:root {
  --blue:#2563eb; --blue-dark:#1d4ed8; --blue-soft:#eff6ff;
  --green:#15803d; --green-soft:#ecfdf3;
  --orange:#b45309; --orange-soft:#fff7ed;
  --red:#dc2626; --red-soft:#fef2f2;
  --text:#172033; --muted:#667085; --bg:#f6f7f9;
  --card:#ffffff; --line:#eaecf0;
}

* { box-sizing:border-box; margin:0; padding:0; }
body { font-family: Inter, system-ui, sans-serif; background:var(--bg); color:var(--text); }
button, input, select { font:inherit; }

button {
  border:0; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer;
  transition: all .15s ease;
}
button:hover { transform:translateY(-1px); }
.primary { background:var(--blue); color:#fff; }
.outline { background:#fff; color:var(--text); border:1px solid var(--line); }
.break-btn { background:var(--orange-soft); color:var(--orange); border:1px solid #fed7aa; }
.danger { background:var(--red-soft); color:var(--red); }
.hidden { display:none !important; }

.wrap { max-width:1280px; margin:auto; padding:0 20px 60px; }

/* HEADER & NAV TABS */
header {
  position:sticky; top:0; z-index:50; height:70px; display:flex;
  justify-space:space-between; align-items:center; background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line); margin-bottom:20px; padding:0 10px;
}
.logo { font-size:24px; font-weight:900; }
.logo span { color:var(--blue); }

.navTabs { display:flex; gap:6px; background:#f1f5f9; padding:4px; border-radius:12px; }
.navTab { padding:8px 18px; border-radius:8px; font-size:13px; font-weight:700; color:var(--muted); background:transparent; }
.navTab.active { background:#fff; color:var(--blue); box-shadow:0 2px 6px rgba(0,0,0,.06); }

/* CARDS & TABLES */
.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
.kpiGrid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
.kpiCard { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; }

/* BORDERLESS CLEAN TABLE */
.cleanTableWrapper { width:100%; overflow-x:auto; }
.cleanTable { width:100%; border-collapse:collapse; border:none !important; white-space:nowrap; }
.cleanTable th, .cleanTable td { border:none !important; padding:14px 16px; text-align:left; font-size:13px; }
.cleanTable th { font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; background:#fafafa; }
.cleanTable tr:hover { background:#f8fafc; }

/* TAGS & BADGES */
.tag { display:inline-block; padding:3px 8px; border-radius:12px; font-size:11px; font-weight:700; }
.tag-online { background:var(--blue-soft); color:var(--blue-dark); }
.tag-walkin { background:var(--orange-soft); color:var(--orange); }
.tag-refund { background:var(--red-soft); color:var(--red); }
.tag-break { background:var(--orange-soft); color:var(--orange); font-size:12px; padding:6px 12px; }

/* FORMS & CONTROLS */
.formGrid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.formGrid .full { grid-column:1/-1; }
input, select { width:100%; border:1px solid #d0d5dd; border-radius:8px; padding:8px 12px; }

.loginWrap { max-width:400px; margin:80px auto; background:#fff; border:1px solid var(--line); border-radius:16px; padding:28px; }
.tableControls { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:16px; }
.filterGroup { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
</style>
</head>

<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="loginScreen" class="loginWrap">
    <div class="logo" style="text-align:center;margin-bottom:12px">Meri<span>Bari</span></div>
    <label style="font-size:12px;font-weight:700">Email</label>
    <input id="loginEmail" type="email" placeholder="doctor@example.com">
    <label style="font-size:12px;font-weight:700;margin-top:10px;display:block">Password</label>
    <input id="loginPass" type="password" placeholder="••••••••">
    <button class="primary" style="width:100%;margin-top:16px" onclick="doLogin()">Login Panel</button>
  </div>

  <!-- MAIN APP -->
  <div id="mainScreen" class="hidden">
    <header>
      <div style="display:flex;align-items:center;gap:20px">
        <div class="logo">Meri<span>Bari</span></div>
        <nav class="navTabs">
          <button class="navTab active" id="tabDashboard" onclick="switchPage('dashboard')">Dashboard</button>
          <button class="navTab" id="tabPatients" onclick="switchPage('patients')">All Patients</button>
        </nav>
      </div>

      <!-- HEADER RIGHT: 5 MIN BREAK & LOGOUT AT CORNER -->
      <div style="display:flex;gap:10px;align-items:center">
        <button id="breakBtn" class="break-btn" onclick="toggleBreak()">☕ 5 Min Break</button>
        <button class="outline" onclick="doLogout()">Logout</button>
      </div>
    </header>

    <div id="app"></div>
  </div>

</div>

<!-- FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBL9PzyO4B86JUcKsskF3xnvxwwecuoN8U",
  authDomain: "meribari.firebaseapp.com",
  projectId: "meribari",
  storageBucket: "meribari.firebasestorage.app",
  messagingSenderId: "624386528748",
  appId: "1:624386528748:web:702f9daf1c5ea1199b5cc9"
};

let fb = { ready: false };
try {
  firebase.initializeApp(firebaseConfig);
  fb.db = firebase.firestore();
  fb.auth = firebase.auth();
  fb.ready = true;
} catch(e) { console.error(e); }

function getTodayStr() {
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

let currentPage = 'dashboard';
let myDoctorId = null;
let queueLive = { currentToken: 0, status: "OPEN" };
let allPatients = [];
let active = [];

/* FILTER & SORT STATES */
let filterDate = getTodayStr();
let searchQuery = "";
let sortOrder = "asc"; // Default: #1 at top

function switchPage(page) {
  currentPage = page;
  document.getElementById("tabDashboard").classList.toggle("active", page === 'dashboard');
  document.getElementById("tabPatients").classList.toggle("active", page === 'patients');
  render();
}

async function toggleBreak() {
  if(!fb.ready || !myDoctorId) return;
  const newStatus = queueLive.status === "BREAK" ? "OPEN" : "BREAK";
  await fb.db.collection("queue").doc(myDoctorId).update({
    status: newStatus,
    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
  });
}

function doLogin() {
  const e = document.getElementById("loginEmail").value;
  const p = document.getElementById("loginPass").value;
  if(fb.ready) fb.auth.signInWithEmailAndPassword(e, p);
}

function doLogout() { if(fb.ready) fb.auth.signOut(); }

if(fb.ready) {
  fb.auth.onAuthStateChanged(user => {
    if(user) {
      myDoctorId = user.uid;
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("mainScreen").classList.remove("hidden");
      listenData();
    } else {
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("mainScreen").classList.add("hidden");
    }
  });
}

function listenData() {
  fb.db.collection("queue").doc(myDoctorId).onSnapshot(doc => {
    queueLive = doc.exists ? doc.data() : { currentToken: 0, status: "OPEN" };
    const btn = document.getElementById("breakBtn");
    if(queueLive.status === "BREAK") {
      btn.innerHTML = "▶ Resume Queue";
      btn.style.background = "#dcfce7"; btn.style.color = "#15803d";
    } else {
      btn.innerHTML = "☕ 5 Min Break";
      btn.style.background = "var(--orange-soft)"; btn.style.color = "var(--orange)";
    }
    render();
  });

  fb.db.collection("appointments").where("doctorId", "==", myDoctorId).onSnapshot(snap => {
    allPatients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    active = allPatients.filter(a => a.status === 'waiting' || a.status === 'current');
    render();
  });
}

async function callNext() {
  const next = Number(queueLive.currentToken || 0) + 1;
  await fb.db.collection("queue").doc(myDoctorId).set({ currentToken: next, status: "OPEN" }, { merge: true });
}

async function addWalkIn() {
  const name = document.getElementById("wiName").value;
  const age = document.getElementById("wiAge").value;
  const mobile = document.getElementById("wiMobile").value;
  const complaint = document.getElementById("wiComplaint").value;
  const amount = document.getElementById("wiAmount").value;
  const payment = document.getElementById("wiPayment").value;

  if(!name) return alert("Enter Patient Name");

  const token = (queueLive.currentToken || 0) + active.length + 1;

  await fb.db.collection("appointments").add({
    patientName: name, patientAge: age, patientGender: "Male/Female",
    patientMobile: mobile, complaint: complaint, doctorId: myDoctorId,
    paymentMethod: payment, amountPaid: Number(amount) || 0,
    tokenNumber: token, status: "waiting", source: "walk_in", refunded: false,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById("wiName").value = "";
  document.getElementById("wiComplaint").value = "";
}

function fmtDate(ts) {
  if(!ts) return "-";
  const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
  return d.toLocaleDateString("en-IN", {day:'2-digit', month:'short', year:'numeric'}) + " • " + d.toLocaleTimeString("en-IN", {hour:'2-digit', minute:'2-digit'});
}

function getPatientISODate(ts) {
  if(!ts) return "";
  const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function render() {
  const app = document.getElementById("app");
  if(currentPage === 'patients') {
    app.innerHTML = renderPatientsPage();
  } else {
    app.innerHTML = renderDashboardPage();
  }
}

function renderDashboardPage() {
  const isBreak = queueLive.status === "BREAK";
  return `
    <div class="card" style="background:${isBreak ? '#fff7ed' : '#fff'}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          ${isBreak ? `<span class="tag tag-break">☕ DOCTOR ON BREAK (5 MIN)</span>` : `<span class="tag tag-online">LIVE QUEUE</span>`}
          <h1 style="font-size:36px;margin-top:8px">Patient No. #${queueLive.currentToken || 0}</h1>
        </div>
        <button class="primary" style="font-size:16px;padding:12px 24px" onclick="callNext()">Call Next →</button>
      </div>
    </div>

    <div class="kpiGrid">
      <div class="kpiCard"><b>Waiting in Queue:</b> <span style="font-size:20px;font-weight:900;color:var(--blue)">${active.length}</span></div>
      <div class="kpiCard"><b>Now Serving:</b> <span style="font-size:20px;font-weight:900">#${queueLive.currentToken || 0}</span></div>
      <div class="kpiCard"><b>Total Patients Today:</b> <span style="font-size:20px;font-weight:900">${allPatients.filter(p => getPatientISODate(p.createdAt) === getTodayStr()).length}</span></div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:12px">➕ Add Walk-in Patient</h3>
      <div class="formGrid">
        <input id="wiName" placeholder="Patient Name">
        <input id="wiAge" type="number" placeholder="Age">
        <input id="wiMobile" placeholder="Mobile Number">
        <select id="wiPayment"><option value="cash">Cash</option><option value="upi">UPI</option></select>
        <input id="wiComplaint" class="full" placeholder="Complaint / Reason for Visit">
        <input id="wiAmount" type="number" placeholder="Amount Paid (₹)">
        <div class="full" style="text-align:right">
          <button class="primary" onclick="addWalkIn()">Add to Queue</button>
        </div>
      </div>
    </div>
  `;
}

function renderPatientsPage() {
  /* FILTERING BY DATE & SEARCH */
  let list = allPatients.filter(p => {
    const matchesDate = !filterDate || getPatientISODate(p.createdAt) === filterDate;
    const q = searchQuery.toLowerCase().trim();
    const matchesSearch = !q || 
      (p.patientName && p.patientName.toLowerCase().includes(q)) ||
      (p.patientMobile && p.patientMobile.includes(q)) ||
      (p.tokenNumber && String(p.tokenNumber).includes(q));
    return matchesDate && matchesSearch;
  });

  /* SORTING (#1 TOP DEFAULT) */
  list.sort((a, b) => {
    const tA = Number(a.tokenNumber || 0);
    const tB = Number(b.tokenNumber || 0);
    return sortOrder === "asc" ? tA - tB : tB - tA;
  });

  return `
    <div class="card">
      <div class="tableControls">
        <h3 style="margin:0">All Patients List (${list.length})</h3>
        
        <div class="filterGroup">
          <!-- DATE PICKER (DEFAULT TODAY) -->
          <div>
            <label style="font-size:10px;font-weight:800;color:var(--muted);display:block">DATE</label>
            <input type="date" value="${filterDate}" onchange="filterDate=this.value; render();" style="width:140px">
          </div>

          <!-- SEARCH BAR -->
          <div>
            <label style="font-size:10px;font-weight:800;color:var(--muted);display:block">SEARCH</label>
            <input type="text" placeholder="Name, Token, Mobile..." value="${searchQuery}" oninput="searchQuery=this.value; render();" style="width:180px">
          </div>

          <!-- SORT DROPDOWN -->
          <div>
            <label style="font-size:10px;font-weight:800;color:var(--muted);display:block">SORT ORDER</label>
            <select onchange="sortOrder=this.value; render();" style="width:160px">
              <option value="asc" ${sortOrder==='asc'?'selected':''}>Token #1 → #N (Oldest)</option>
              <option value="desc" ${sortOrder==='desc'?'selected':''}>Token #N → #1 (Newest)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="cleanTableWrapper">
        <table class="cleanTable">
          <thead>
            <tr>
              <th>S.No. / Patient No.</th>
              <th>Patient Name</th>
              <th>Age & Gender</th>
              <th>Complaint</th>
              <th>Booking Time</th>
              <th>Booking Source</th>
              <th>Payment</th>
              <th>Amount Paid</th>
              <th>Refund Status</th>
              <th>Mobile No.</th>
            </tr>
          </thead>
          <tbody>
            ${list.length === 0 ? `<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:30px">No patients found for selected filters</td></tr>` : ''}
            ${list.map((p, i) => `
              <tr>
                <td style="font-weight:800;color:var(--blue)">#${p.tokenNumber || (i + 1)}</td>
                <td style="font-weight:700">${p.patientName || '-'}</td>
                <td>${p.patientAge ? p.patientAge + ' Yrs' : 'N/A'} / ${p.patientGender || 'Unspecified'}</td>
                <td>${p.complaint || 'No complaint'}</td>
                <td style="color:var(--muted);font-size:12px">${fmtDate(p.createdAt)}</td>
                <td><span class="tag ${p.source==='walk_in'?'tag-walkin':'tag-online'}">${p.source==='walk_in'?'Walk-in':'Online'}</span></td>
                <td>${(p.paymentMethod || 'Cash').toUpperCase()}</td>
                <td style="font-weight:700">₹${p.amountPaid || 0}</td>
                <td>${p.refunded ? `<span class="tag tag-refund">Refunded (₹${p.refundAmount})</span>` : 'N/A'}</td>
                <td>${p.patientMobile || '-'}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

render();
</script>
</body>
</html>
