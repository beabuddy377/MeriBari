<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeriBari — Operator Panel</title>

<style>
:root {
  --blue-primary: #2563eb;
  --blue-hover: #1d4ed8;
  --blue-soft: #eff6ff;
  --blue-border: #dbeafe;
  --orange-soft: #ffedd5;
  --orange-text: #c2410c;
  --green-soft: #dcfce7;
  --green-text: #15803d;
  --text-dark: #0f172a;
  --text-muted: #64748b;
  --bg-main: #f8fafc;
  --card-bg: #ffffff;
  --border-color: #e2e8f0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-main);
  color: var(--text-dark);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font-family: inherit; }

button {
  border: none;
  border-radius: 10px;
  padding: 10px 18px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
button:hover { opacity: 0.92; transform: translateY(-1px); }

.btn-primary { background-color: var(--blue-primary); color: #ffffff; }
.btn-outline { background-color: #ffffff; color: var(--text-dark); border: 1px solid var(--border-color); }
.hidden { display: none !important; }

.container { max-width: 1000px; margin: 0 auto; padding: 0 16px 60px; }

/* HEADER */
header {
  position: sticky; top: 0; z-index: 100; height: 68px;
  display: flex; justify-content: space-between; align-items: center;
  background-color: #ffffff; border-bottom: 1px solid var(--border-color);
  margin-bottom: 20px; padding: 0 20px;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.logo { font-size: 24px; font-weight: 900; color: #000; letter-spacing: -0.5px; }
.logo span { color: var(--blue-primary); }

.header-doc-badge { display: flex; align-items: center; gap: 10px; border-left: 1px solid var(--border-color); padding-left: 16px; }
.avatar-circle { width: 34px; height: 34px; border-radius: 50%; background: var(--blue-soft); color: var(--blue-primary); font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.doc-info { line-height: 1.2; }
.doc-name { font-weight: 800; font-size: 13px; color: var(--text-dark); }
.doc-spec { font-size: 11px; color: var(--text-muted); }

.header-right { display: flex; align-items: center; gap: 10px; }

/* CARDS */
.card {
  background-color: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 20px 24px;
  margin-bottom: 16px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
}

/* HERO QUEUE CARD */
.hero-queue-card {
  background: linear-gradient(135deg, #f0f7ff 0%, #f8fafc 100%);
  border: 1px solid var(--blue-border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 16px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 20px;
  align-items: center;
}

.hero-left-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.live-pill { background: var(--green-soft); color: var(--green-text); font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; }
.live-sub { font-size: 12px; color: var(--text-muted); font-weight: 600; }
.hero-token-title { font-size: 28px; font-weight: 900; color: var(--text-dark); margin-bottom: 2px; }
.hero-token-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }

.hero-middle-call { margin-top: 10px; }

.hero-right-boxes { display: flex; flex-direction: column; gap: 10px; min-width: 220px; }
.side-mini-box { background: #ffffff; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 16px; }
.side-mini-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.side-mini-val { font-size: 18px; font-weight: 900; color: var(--text-dark); margin-top: 2px; }

/* 3 KPI GRID */
.kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
.kpi-item { background: #ffffff; border: 1px solid var(--border-color); border-radius: 14px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: flex-start; }
.kpi-title { font-size: 12px; font-weight: 700; color: var(--text-muted); }
.kpi-num { font-size: 24px; font-weight: 900; color: var(--text-dark); margin-top: 6px; }
.kpi-icon-badge { width: 28px; height: 28px; border-radius: 8px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 13px; }

/* FORM & INPUTS */
.form-title { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.offline-badge { background: var(--orange-soft); color: var(--orange-text); font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 10px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 11px; font-weight: 700; color: var(--text-muted); }

input, select {
  width: 100%; border: 1px solid #d1d5db; border-radius: 10px;
  padding: 10px 14px; font-size: 13px; outline: none; background: #fff;
}
input:focus, select:focus { border-color: var(--blue-primary); }

.count-circle-badge { background: var(--blue-soft); color: var(--blue-primary); font-size: 11px; font-weight: 800; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-left: 6px; }

/* PATIENT CARD ITEM (CARD LIST VIEW) */
.patient-card-item {
  border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 18px; margin-bottom: 10px; background: #fff;
}
.p-title { font-size: 14px; font-weight: 800; color: var(--text-dark); }
.p-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); margin: 4px 0; }
.pill-badge { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; text-transform: uppercase; }
.pill-offline { background: var(--orange-soft); color: var(--orange-text); }
.pill-online { background: var(--blue-soft); color: var(--blue-primary); }
.pill-current { background: var(--orange-soft); color: var(--orange-text); }
.pill-completed { background: var(--green-soft); color: var(--green-text); }

.p-complaint { font-size: 12px; color: var(--text-dark); margin-bottom: 4px; }
.p-footer { font-size: 11px; color: var(--text-muted); font-weight: 600; }

.login-box { max-width: 380px; margin: 80px auto; background: #fff; border: 1px solid var(--border-color); border-radius: 16px; padding: 28px; }
</style>
</head>

<body>

<!-- HEADER -->
<header id="mainHeader" class="hidden">
  <div class="header-left">
    <div class="logo">Meri<span>Bari</span></div>
    <div class="header-doc-badge">
      <div class="avatar-circle">DS</div>
      <div class="doc-info">
        <div class="doc-name">Dr Shivani yadav</div>
        <div class="doc-spec">Dermatologist</div>
      </div>
    </div>
  </div>

  <div class="header-right">
    <button class="btn-primary" onclick="callNext()">Call Next →</button>
    <button class="btn-outline" onclick="doLogout()">Logout</button>
  </div>
</header>

<div class="container">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-box">
    <div class="logo" style="text-align: center; margin-bottom: 16px;">Meri<span>Bari</span></div>
    <div style="margin-bottom: 12px;">
      <label class="form-label">Email</label>
      <input id="loginEmail" type="email" placeholder="doctor@example.com">
    </div>
    <div style="margin-bottom: 16px;">
      <label class="form-label">Password</label>
      <input id="loginPass" type="password" placeholder="••••••••">
    </div>
    <button class="btn-primary" style="width: 100%; padding: 12px;" onclick="doLogin()">Login Panel</button>
  </div>

  <!-- DASHBOARD / MAIN CONTENT -->
  <div id="mainScreen" class="hidden">
    <div id="app"></div>
  </div>

</div>

<!-- FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBL9PzyO4B86JUcKsskF3xnvxwwecuoN8U",
  authDomain: "meribari.firebaseapp.com",
  projectId: "meribari",
  storageBucket: "meribari.firebasestorage.app",
  messagingSenderId: "624386528748",
  appId: "1:624386528748:web:702f9daf1c5ea1199b5cc9"
};

let fb = { ready: false };
try {
  firebase.initializeApp(firebaseConfig);
  fb.db = firebase.firestore();
  fb.auth = firebase.auth();
  fb.ready = true;
} catch(e) { console.error(e); }

let myDoctorId = null;
let queueLive = { currentToken: 5, status: "BREAK" };
let allPatients = [];

function getTodayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

let filterDate = getTodayISO();
let searchQuery = "";
let sortOrder = "asc"; // #1 Token at top

function doLogin() {
  const e = document.getElementById("loginEmail").value;
  const p = document.getElementById("loginPass").value;
  if(fb.ready) fb.auth.signInWithEmailAndPassword(e, p);
}

function doLogout() { if(fb.ready) fb.auth.signOut(); }

if(fb.ready) {
  fb.auth.onAuthStateChanged(user => {
    if(user) {
      myDoctorId = user.uid;
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("mainHeader").classList.remove("hidden");
      document.getElementById("mainScreen").classList.remove("hidden");
      listenData();
    } else {
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("mainHeader").classList.add("hidden");
      document.getElementById("mainScreen").classList.add("hidden");
    }
  });
}

function listenData() {
  fb.db.collection("queue").doc(myDoctorId).onSnapshot(doc => {
    if(doc.exists) queueLive = doc.data();
    render();
  });

  fb.db.collection("appointments").where("doctorId", "==", myDoctorId).onSnapshot(snap => {
    allPatients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}

async function callNext() {
  const next = Number(queueLive.currentToken || 0) + 1;
  await fb.db.collection("queue").doc(myDoctorId).set({ currentToken: next, status: "OPEN" }, { merge: true });
}

async function addWalkIn() {
  const name = document.getElementById("wiName")?.value;
  const age = document.getElementById("wiAge")?.value;
  const mobile = document.getElementById("wiMobile")?.value;
  const payment = document.getElementById("wiPayment")?.value;
  const complaint = document.getElementById("wiComplaint")?.value;
  const amount = document.getElementById("wiAmount")?.value;

  if(!name) return alert("Enter Patient Name");

  const nextToken = (queueLive.currentToken || 0) + 1;

  await fb.db.collection("appointments").add({
    patientName: name, patientAge: age, patientMobile: mobile,
    paymentMethod: payment || "cash", complaint: complaint,
    amountPaid: Number(amount) || 0, tokenNumber: nextToken,
    status: "waiting", source: "walk_in", doctorId: myDoctorId,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById("wiName").value = "";
  if(document.getElementById("wiComplaint")) document.getElementById("wiComplaint").value = "";
}

function fmtDate(ts) {
  if(!ts) return "20 Aug 2026 • 01:40 pm";
  const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
  return d.toLocaleDateString("en-IN", {day:'2-digit', month:'short', year:'numeric'}) + " • " + d.toLocaleTimeString("en-IN", {hour:'2-digit', minute:'2-digit', hour12:true});
}

function getISO(ts) {
  if(!ts) return getTodayISO();
  const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function render() {
  const app = document.getElementById("app");
  if(!app) return;

  const currentPatient = allPatients.find(p => p.tokenNumber === queueLive.currentToken) || { patientName: "Prince Rajput" };
  const waitingCount = allPatients.filter(p => p.status === 'waiting').length;

  // Filter & Sort Patients List
  let list = allPatients.filter(p => {
    const mDate = !filterDate || getISO(p.createdAt) === filterDate;
    const q = searchQuery.toLowerCase().trim();
    const mSearch = !q || (p.patientName && p.patientName.toLowerCase().includes(q)) || (p.patientMobile && p.patientMobile.includes(q)) || (p.tokenNumber && String(p.tokenNumber).includes(q));
    return mDate && mSearch;
  });

  list.sort((a,b) => sortOrder === "asc" ? (a.tokenNumber||0) - (b.tokenNumber||0) : (b.tokenNumber||0) - (a.tokenNumber||0));

  app.innerHTML = `
    <!-- DOCTOR PROFILE CARD -->
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="avatar-circle" style="width:48px; height:48px; font-size:16px;">DS</div>
        <div>
          <h2 style="font-size:16px; font-weight:800;">Dr Shivani yadav</h2>
          <div style="font-size:12px; color:var(--text-muted);">Dermatologist • Derma care</div>
          <div style="font-size:12px; color:var(--text-muted);">Consultation Fee: ₹500 • 13:00–19:00</div>
        </div>
      </div>
      <button class="btn-outline">Edit Profile</button>
    </div>

    <!-- LIVE QUEUE HERO CARD -->
    <div class="hero-queue-card">
      <div>
        <div class="hero-left-top">
          <span class="live-pill">● LIVE QUEUE</span>
          <span class="live-sub">Doctor's consultation queue</span>
        </div>
        <div class="hero-token-title">Token #${queueLive.currentToken || 5}</div>
        <div class="hero-token-sub">Currently consulting <b>${currentPatient.patientName}</b></div>
        
        <div style="font-size:11px; font-weight:800; color:var(--blue-primary); text-transform:uppercase;">NOW SERVING</div>
        <div style="font-size:36px; font-weight:900; color:var(--blue-primary); line-height:1;">#${queueLive.currentToken || 5}</div>
        
        <div class="hero-middle-call">
          <button class="btn-primary" style="padding:10px 24px;" onclick="callNext()">Call Next →</button>
        </div>
      </div>

      <div class="hero-right-boxes">
        <div class="side-mini-box">
          <div class="side-mini-label">QUEUE STATUS</div>
          <div class="side-mini-val">${queueLive.status || 'BREAK'}</div>
        </div>
        <div class="side-mini-box">
          <div class="side-mini-label">NEXT SUGGESTED TOKEN</div>
          <div class="side-mini-val">#${(queueLive.currentToken || 5) + 1}</div>
        </div>
      </div>
    </div>

    <!-- 3 KPI CARDS ROW -->
    <div class="kpi-row">
      <div class="kpi-item">
        <div>
          <div class="kpi-title">Waiting</div>
          <div class="kpi-num">${waitingCount}</div>
        </div>
        <div class="kpi-icon-badge">👤</div>
      </div>
      <div class="kpi-item">
        <div>
          <div class="kpi-title">Current</div>
          <div class="kpi-num">#${queueLive.currentToken || 5}</div>
        </div>
        <div class="kpi-icon-badge">🩺</div>
      </div>
      <div class="kpi-item">
        <div>
          <div class="kpi-title">Requests</div>
          <div class="kpi-num">0</div>
        </div>
        <div class="kpi-icon-badge">📋</div>
      </div>
    </div>

    <!-- ADD WALK-IN PATIENT FORM -->
    <div class="card">
      <div class="form-title">
        <span>+ Add Walk-in Patient</span>
        <span class="offline-badge">OFFLINE</span>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Patient Name</label>
          <input id="wiName" placeholder="Enter patient name">
        </div>
        <div class="form-group">
          <label class="form-label">Age</label>
          <input id="wiAge" placeholder="Age">
        </div>
        <div class="form-group">
          <label class="form-label">Mobile Number</label>
          <input id="wiMobile" placeholder="10-digit mobile number">
        </div>
        <div class="form-group">
          <label class="form-label">Payment Method</label>
          <select id="wiPayment">
            <option value="cash">Cash</option>
            <option value="upi">UPI</option>
          </select>
        </div>
        <div class="form-group full">
          <label class="form-label">Complaint / Reason for Visit</label>
          <input id="wiComplaint" placeholder="e.g. Fever, headache, follow-up...">
        </div>
        <div class="form-group">
          <label class="form-label">Amount Paid</label>
          <input id="wiAmount" placeholder="₹ Amount">
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
        <div style="font-size:12px; color:var(--text-muted); font-weight:600;">
          Suggested token: <b>#${(queueLive.currentToken || 5) + 1}</b>
        </div>
        <button class="btn-primary" onclick="addWalkIn()">Add Patient →</button>
      </div>
    </div>

    <!-- ONLINE BOOKING REQUESTS -->
    <div class="card">
      <h3 style="font-size:15px; font-weight:800;">
        Online Booking Requests <span class="count-circle-badge">0</span>
      </h3>
    </div>

    <!-- ALL PATIENTS CARD LIST VIEW (MATCHING EXACT SCREENSHOT) -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
        <h3 style="font-size:15px; font-weight:800;">
          All Patients <span class="count-circle-badge">${list.length}</span>
        </h3>

        <!-- INTEGRATED FILTERS (DATE, SEARCH, ASC SORT) -->
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <input type="date" value="${filterDate}" onchange="filterDate=this.value; render();" style="width:130px; padding:6px 8px; font-size:12px;">
          <input type="text" placeholder="Search name/mobile..." value="${searchQuery}" oninput="searchQuery=this.value; render();" style="width:150px; padding:6px 8px; font-size:12px;">
          <select onchange="sortOrder=this.value; render();" style="width:130px; padding:6px 8px; font-size:12px;">
            <option value="asc" ${sortOrder==='asc'?'selected':''}>Token #1 First</option>
            <option value="desc" ${sortOrder==='desc'?'selected':''}>Token #N First</option>
          </select>
        </div>
      </div>

      <!-- PATIENTS CARDS -->
      <div>
        ${list.length === 0 ? `<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:13px;">No patients found</div>` : ''}

        ${list.map(p => `
          <div class="patient-card-item">
            <div class="p-title">${p.patientName || 'Prince Rajput'} • Token #${p.tokenNumber || 5}</div>
            <div class="p-meta">
              <span>${p.patientAge || '66'} yrs</span> • 
              <span class="pill-badge ${p.source==='online'?'pill-online':'pill-offline'}">${p.source==='online'?'ONLINE':'OFFLINE'}</span> • 
              <span class="pill-badge ${p.status==='completed'?'pill-completed':'pill-current'}">${p.status || 'current'}</span>
            </div>
            <div class="p-complaint">${p.complaint || 'Ttf • Rt'}</div>
            <div class="p-footer">${fmtDate(p.createdAt)} • ₹${p.amountPaid || 58} (${(p.paymentMethod || 'CASH').toUpperCase()})</div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- REFUND PATIENT SECTION -->
    <div class="card">
      <h3 style="font-size:15px; font-weight:800; margin-bottom:2px;">💰 Refund Patient</h3>
      <div style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">Search a patient by name or mobile number.</div>
      <div style="display:flex; gap:10px;">
        <input placeholder="Search patient..." style="flex:1;">
        <button class="btn-outline">Search</button>
      </div>
    </div>
  `;
}

render();
</script>
</body>
</html>
