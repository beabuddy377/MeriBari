<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClinicQ — Digital Clinic Queue</title>
<style>
:root{--blue:#1769ff;--dark:#17324d;--muted:#64788a;--bg:#f4f8fc;--line:#e2eaf2;--green:#18864b;--orange:#9a6500;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--dark)}
button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:13px 16px;font-weight:750;cursor:pointer}
.primary{background:var(--blue);color:#fff}.secondary{background:#e9f1ff;color:#1258c4}.outline{background:#fff;border:1px solid var(--line);color:var(--dark)}.danger{background:#ffe9e7;color:var(--red)}
.app{max-width:620px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 35px #17324d12}
header{height:68px;padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:10}
.logo{font-size:24px;font-weight:900}.logo span{color:var(--blue)}.screen{padding:22px 20px 105px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #17324d0a}
h1{font-size:28px;line-height:1.15;margin:7px 0 10px}h2{font-size:20px;margin:5px 0 12px}h3{font-size:16px;margin:0 0 8px}p{color:var(--muted);line-height:1.5;margin:7px 0}.small{font-size:12px;color:var(--muted)}.center{text-align:center}
label{display:block;font-size:13px;font-weight:750;margin:13px 0 6px}input,select,textarea{width:100%;border:1px solid #ccd9e5;border-radius:12px;padding:13px;background:#fff;outline:none}textarea{min-height:85px}
.row{display:flex;gap:10px}.row>*{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:750;background:#eaf7ef;color:var(--green)}.warning{background:#fff4d5;color:var(--orange)}.dangerTag{background:#ffe9e7;color:var(--red)}
.kpi{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef2f5}.kpi:last-child{border-bottom:0}.kpi b{font-size:18px}
.token{font-size:72px;line-height:1;font-weight:950;color:var(--blue);text-align:center;margin:8px 0}.tokenLabel{text-align:center;color:var(--muted);font-size:13px}
.avatar{width:56px;height:56px;border-radius:50%;background:#eaf1ff;color:var(--blue);display:grid;place-items:center;font-size:22px;font-weight:900;flex:none}.doctor{display:flex;gap:14px;align-items:flex-start}
.big{width:100%;margin-top:10px}.muted{background:#f7fafc}.success{padding:13px;border-radius:12px;background:#e9f8ef;color:#176b38}.alert{padding:13px;border-radius:12px;background:#fff4d5;color:#765600}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:20;padding:7px 4px}.nav button{background:none;color:#62788a;padding:8px 5px;font-size:11px}.nav button.active{color:var(--blue)}
.splash{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px}.cross{font-size:64px}.splash .logo{font-size:42px}.splash p{max-width:400px;margin:10px auto}
.hidden{display:none!important}.back{background:none;padding:0;color:var(--blue);font-weight:750;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tv{min-height:100vh;background:#0b1521;color:#fff;padding:6vh 5vw;text-align:center}.tv .tvnow{font-size:16vw;font-weight:950;color:#58a2ff;line-height:1}.tv .tvnext{font-size:10vw;font-weight:900}.tv p{color:#b7c7d8;font-size:22px}
@media(min-width:700px){.app{min-height:100vh}.screen{padding-left:28px;padding-right:28px}}
</style>

<style>
/* ClinicQ Post-Consultation Feedback */
.feedback-modal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}.feedback-modal.hidden{display:none}.feedback-card{background:#fff;width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:24px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.22)}.feedback-close{position:absolute;right:12px;top:8px;border:0;background:none;font-size:28px;cursor:pointer;color:#777}.feedback-icon{width:54px;height:54px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:#eaf8f0;color:#17864b;font-size:26px;font-weight:800}.feedback-card h2,.feedback-card .feedback-muted{text-align:center}.feedback-muted{color:#68707a}.feedback-options{display:grid;gap:10px;margin:16px 0}.feedback-option{width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:13px 14px;border:1px solid #e4e9ee;border-radius:14px;background:#fff;cursor:pointer;font-size:15px}.feedback-option.selected{border:2px solid #17864b;background:#f2fbf6}.feedback-option span{display:flex;flex-direction:column;gap:3px}.feedback-option small{color:#777}.feedback-mini{display:flex;gap:8px;margin:10px 0 14px}.feedback-mini button{flex:1;padding:10px;border:1px solid #e4e9ee;border-radius:12px;background:#fff;cursor:pointer}.feedback-mini button.selected{border:2px solid #17864b;background:#f2fbf6}.feedback-comment{width:100%;min-height:78px;box-sizing:border-box;border:1px solid #e4e9ee;border-radius:12px;padding:11px;margin:8px 0 12px;font:inherit}.feedback-primary{width:100%;padding:13px;border:0;border-radius:12px;background:#17864b;color:#fff;font-weight:700;cursor:pointer}.feedback-thanks{text-align:center;width:min(390px,100%)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="clinicq_demo_v1";
const defaultState={
  screen:"splash", role:"patient", logged:false, lang:"en", otpSent:false,
  patients:[
    {id:"p1",name:"Myself",fullName:"Prince",age:28,gender:"Male",mobile:"",complaint:""},
    {id:"p2",name:"Father",fullName:"Raj Kumar",age:55,gender:"Male",mobile:"",complaint:"Headache"},
    {id:"p3",name:"Mother",fullName:"Sunita",age:50,gender:"Female",mobile:"",complaint:""}
  ],
  selectedPatient:"p2", selectedDoctor:"d1", appointment:null,
  doctor:{id:"d1",name:"Dr. Saurav Gupta",specialty:"Neurologist",qualifications:["DM – Ram Manohar Lohia","MD – KGMU","MBBS – GRMC"],experience:"16 Years Experience",clinic:"Brain and Neurology Clinic",fee:500,platformFee:100,serviceFee:20,address:"Brain and Neurology Clinic",hours:"10:00 AM – 2:00 PM",upi:"clinicq@upi",emergency:"Admin configured"},
  queue:{current:24,avg:5,status:"OPEN",lastUpdated:Date.now()},
  pending:[],
  queueRows:[
    {token:21,name:"Rahul",age:45,complaint:"Headache",status:"Completed",source:"Offline"},
    {token:22,name:"Amit",age:32,complaint:"Migraine",status:"Completed",source:"Offline"},
    {token:23,name:"Neha",age:28,complaint:"Fever",status:"Completed",source:"Offline"},
    {token:24,name:"Priya",age:35,complaint:"Headache",status:"Current",source:"Offline"}
  ]
};
let S=load();

firebase.auth().onAuthStateChanged(async (user)=>{
  if(user){
    S.logged = true;
    S.uid = user.uid;
    S.mobile = (user.phoneNumber || S.mobile || "").replace("+91","");
    localStorage.setItem("meribari_uid", user.uid);
    save();
    try{ await loadPatients(); }catch(e){ console.warn("Patient load:", e); }
  }
});
function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem(KEY))}}catch(e){return defaultState}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function total(){return S.doctor.fee+S.doctor.platformFee}
function selected(){return S.patients.find(x=>x.id===S.selectedPatient)||S.patients[0]}
function waitFor(token){return Math.max(0,token-S.queue.current)*S.queue.avg}
function setScreen(x){S.screen=x;save();render()}
function header(title=""){return `<header><div class="logo">Meri<span>Bari</span></div><div class="top-actions">${title?`<span class="small">${esc(title)}</span>`:""}<button class="outline" onclick="switchRole()">Role</button></div></header>`}
function nav(active){return `<div class="nav">
<button class="${active==='home'?'active':''}" onclick="setScreen('home')">⌂<br>Home</button>
<button class="${active==='doctors'?'active':''}" onclick="setScreen('doctors')">⌕<br>Find Doctor</button>
<button class="${active==='token'?'active':''}" onclick="setScreen('token')">#<br>My Patient No.</button>
<button class="${active==='appointments'?'active':''}" onclick="setScreen('appointments')">▣<br>Appointments</button>
<button class="${active==='profile'?'active':''}" onclick="setScreen('profile')">●<br>Profile</button></div>`}
function render(){
  const a=document.getElementById("app");
  if(S.screen==="splash"){a.innerHTML=`<div class="splash"><div><div class="cross">⚕</div><div class="logo">Meri<span>Bari</span></div><p>अब इंतज़ार हुआ खत्म, सीधे घर से पहुँचें डॉक्टर के पास।</p><p><b>No More Waiting. Reach Your Doctor from Home direct at the Right Time.</b></p><p>लाइन में नहीं, घर से करें इंतज़ार।<br><b>Don't Wait in Line, Wait from Home.</b></p><button class="primary" onclick="setScreen('language')">Get Started</button></div></div>`;return}
  if(S.screen==="language"){a.innerHTML=`${header()}<div class="screen center"><h1>Choose Language</h1><p>हिंदी or English</p><div class="card"><button class="primary big" onclick="S.lang='hi';setScreen('login')">हिंदी</button><button class="secondary big" onclick="S.lang='en';setScreen('login')">English</button></div></div>`;return}
  if(S.screen==="login"){a.innerHTML=`${header()}<div class="screen"><h1>Welcome to MeriBari</h1><p>Login / Continue with Mobile Number</p><div class="card"><label>Mobile Number</label><input id="mobile" inputmode="numeric" maxlength="10" placeholder="Enter 10-digit mobile number"><button class="primary big" onclick="sendOtp()">Send OTP</button><div id="recaptcha-container"></div><div class="small center" style="margin-top:10px">Secure OTP verification via Firebase</div></div></div>`;return}
  if(S.screen==="otp"){a.innerHTML=`${header()}<div class="screen"><h1>Verify OTP</h1><p>Enter the 6-digit OTP.</p><div class="card"><div class="alert center">OTP sent to your mobile number</div><label>OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="Enter OTP"><button class="primary big" onclick="verifyOtp()">Verify & Continue</button><button class="outline big" onclick="sendOtp()">Resend OTP</button></div></div>`;return}
  if(S.screen==="selectPatient"){a.innerHTML=`${header()}<div class="screen"><h1>Who is the appointment for?</h1><p>Select a family patient.</p>${S.patients.map(p=>`<div class="card" onclick="choosePatient('${p.id}')"><h3>${esc(p.name)} – ${esc(p.fullName)}</h3><p>${p.age} years • ${esc(p.gender)} ${p.complaint?`• ${esc(p.complaint)}`:""}</p></div>`).join("")}<button class="secondary big" onclick="setScreen('addPatient')">＋ Add New Patient</button></div>`;return}
  if(S.screen==="addPatient"){a.innerHTML=`${header()}<div class="screen"><button class="back" onclick="setScreen('selectPatient')">← Back</button><h1>Add Patient</h1><div class="card"><label>Relationship</label><input id="rel" placeholder="e.g. Mother"><label>Full Name</label><input id="pf" placeholder="Full name"><div class="row"><div><label>Age</label><input id="pa" type="number"></div><div><label>Gender</label><select id="pg"><option>Male</option><option>Female</option><option>Other</option></select></div></div><label>Mobile Number</label><input id="pm" inputmode="numeric"><label>Complaint / Problem</label><textarea id="pc"></textarea><button class="primary big" onclick="addPatient()">Save Patient</button></div></div>`;return}
  if(S.screen==="home"){a.innerHTML=header()+`<div class="screen"><h1>Hello, ${esc(selected().fullName)}</h1><p>Don't wait at the clinic. Wait at home.</p>${S.appointment?appointmentCard():`<div class="card"><h2>Find a Doctor</h2><p>Search doctors, check queue status and book your appointment.</p><button class="primary big" onclick="setScreen('doctors')">Find Doctor</button></div>`}<div class="card"><h2>How MeriBari works</h2><p>1. Book → 2. Pay/Reserve → 3. Operator assigns token → 4. Track queue → 5. Get reminder → 6. Reach clinic.</p></div></div>${nav('home')}`;return}
  if(S.screen==="doctors"){a.innerHTML=header()+`<div class="screen"><h1>Find Your Doctor</h1><input id="search" oninput="filterDoctors()" placeholder="Search doctor, specialty or clinic"><div id="doctorList">${doctorCard()}</div><div class="card"><button class="outline big" onclick="emergency()">Emergency Help</button><p class="small">For medical emergencies, contact appropriate emergency services or a medical facility.</p></div></div>${nav('doctors')}`;return}
  if(S.screen==="doctor"){a.innerHTML=header()+`<div class="screen"><button class="back" onclick="setScreen('doctors')">← Back</button>${doctorProfile()}</div>${nav('doctors')}`;return}
  if(S.screen==="book"){a.innerHTML=header()+`<div class="screen"><button class="back" onclick="setScreen('doctor')">← Back</button><h1>Book Appointment</h1><div class="card"><h3>${esc(S.doctor.name)}</h3><p>${esc(S.doctor.specialty)} • ${esc(S.doctor.clinic)}</p><p>Appointment for: <b>${esc(selected().fullName)}</b>, ${selected().age} years</p><p>Complaint: ${esc(selected().complaint||"Not specified")}</p><label>Date</label><input type="date" id="date" value="${new Date().toISOString().slice(0,10)}"><h3 style="margin-top:20px">Payment Options</h3><button class="primary big" onclick="choosePayment('online')">Pay Consultation Online — ₹${total()}</button><button class="secondary big" onclick="choosePayment('cash')">Cash at Clinic — Pay ₹${S.doctor.serviceFee} Online</button></div></div>${nav('appointments')}`;return}
  if(S.screen==="payment"){a.innerHTML=header()+`<div class="screen"><button class="back" onclick="setScreen('book')">← Back</button><h1>Complete Payment</h1><div class="card center"><h2>${S.payment==='online'?'Online Consultation':'MeriBari Service Fee'}</h2><div class="token" style="font-size:42px">₹${S.payment==='online'?total():S.doctor.serviceFee}</div><p>${S.payment==='online'?'UPI / QR payment for the consultation booking.':'₹20 service fee reserves remote queue tracking. Consultation fee ₹500 is paid cash at clinic.'}</p><div class="alert">Demo Mode — no real money is transferred.</div><button class="primary big" onclick="simulatePayment()">Pay Now</button></div></div>`;return}
  if(S.screen==="waiting"){a.innerHTML=header()+`<div class="screen"><h1>Appointment Request Submitted</h1><div class="success"><b>Payment Successful ✓</b><br>${S.payment==='online'?'₹'+total()+' paid':'₹'+S.doctor.serviceFee+' MeriBari Service Fee paid'}</div><div class="card"><h3>Status</h3><p><b>Waiting for Patient No. Assignment</b></p><p>The clinic operator will assign your token according to the actual combined offline + online queue.</p>${S.payment==='cash'?'<p>Doctor consultation: <b>₹500 — Pay Cash at Clinic</b></p>':""}</div><button class="primary big" onclick="setScreen('home')">Go to Home</button><button class="outline big" onclick="setScreen('operator')">Open Operator Demo</button></div>`;return}
  if(S.screen==="token"){a.innerHTML=header()+`<div class="screen"><h1>My Patient No.</h1>${S.appointment?tokenCard():`<div class="card center"><p>No active token yet.</p><button class="primary" onclick="setScreen('doctors')">Find Doctor</button></div>`}</div>${nav('token')}`;return}
  if(S.screen==="appointments"){a.innerHTML=header()+`<div class="screen"><h1>Appointments</h1>${S.appointment?appointmentCard():`<div class="card"><p>No appointments yet.</p></div>`}</div>${nav('appointments')}`;return}
  if(S.screen==="profile"){a.innerHTML=header()+`<div class="screen"><h1>Profile</h1><div class="card"><h3>Family Patients</h3>${S.patients.map(p=>`<p><b>${esc(p.name)} – ${esc(p.fullName)}</b><br>${p.age} years • ${esc(p.gender)}</p>`).join("")}<button class="secondary big" onclick="setScreen('addPatient')">＋ Add Patient</button></div><div class="card"><h3>Language</h3><button class="outline" onclick="S.lang=S.lang==='en'?'hi':'en';save();render()">Switch to ${S.lang==='en'?'हिंदी':'English'}</button></div><div class="card"><h3>Demo Controls</h3><button class="outline big" onclick="setScreen('operator')">Operator Dashboard</button><button class="outline big" onclick="setScreen('tv')">Launch TV Mode</button><button class="danger big" onclick="resetDemo()">Reset Demo</button></div></div>${nav('profile')}`;return}
  if(S.screen==="operator"){a.innerHTML=operatorView();return}
  if(S.screen==="tv"){a.innerHTML=tvView();return}
}
function doctorCard(){
 const ahead=Math.max(0,S.doctor.current-S.queue.current);
 return `<div class="card"><div class="doctor"><div class="avatar">SG</div><div><h2>${esc(S.doctor.name)}</h2><p><b>${esc(S.doctor.specialty)}</b></p><p>${esc(S.doctor.qualifications.join(" • "))}</p><span class="tag">${esc(S.doctor.experience)}</span></div></div><div class="kpi"><span>Clinic</span><b>${esc(S.doctor.clinic)}</b></div><div class="kpi"><span>Total online amount</span><b>₹${total()}</b></div><div class="kpi"><span>Currently serving</span><b>#${S.queue.current}</b></div><div class="kpi"><span>Estimated wait for next patient number</span><b>${S.queue.avg} min</b></div><button class="primary big" onclick="setScreen('doctor')">View Doctor & Book</button></div>`;
}
function doctorProfile(){
 return `<div class="card"><div class="doctor"><div class="avatar">SG</div><div><h2>${esc(S.doctor.name)}</h2><p><b>${esc(S.doctor.specialty)}</b></p><p>${esc(S.doctor.qualifications.join(" • "))}</p><span class="tag">${esc(S.doctor.experience)}</span></div></div><p><b>Clinic:</b> ${esc(S.doctor.clinic)}</p><p><b>Consultation Fee:</b> ₹${S.doctor.fee}</p><p><b>Total Online Appointment:</b> ₹${total()}</p><p><b>Availability:</b> ${esc(S.doctor.hours)}</p><p><b>Currently Serving:</b> Patient No. #${S.queue.current}</p><button class="primary big" onclick="setScreen('book')">Book Appointment</button></div>`;
}
function appointmentCard(){
 if(!S.appointment)return "";
 const x=S.appointment;
 return `<div class="card"><span class="tag">${esc(x.status)}</span><h2>My Appointment</h2><p>Doctor: <b>${esc(S.doctor.name)}</b></p><p>Patient: <b>${esc(selected().fullName)}</b></p>${x.token?`<div class="tokenLabel">YOUR PATIENT NO.</div><div class="token">#${x.token}</div><p class="center">Current Patient No. <b>#${S.queue.current}</b> • ${Math.max(0,x.token-S.queue.current)} patients ahead</p><p class="center">Estimated wait: <b>${waitFor(x.token)} minutes</b></p>`:`<div class="alert">Waiting for Patient No. Assignment</div>`}<button class="primary big" onclick="setScreen('token')">Track Live Queue</button></div>`;
}
function tokenCard(){
 const x=S.appointment;
 if(!x.token)return appointmentCard();
 const mins=waitFor(x.token);
 return `<div class="card center"><div class="tokenLabel">YOUR PATIENT NO.</div><div class="token">#${x.token}</div><p>${esc(S.doctor.name)} • ${esc(selected().fullName)}</p><div class="grid2"><div class="card muted"><div class="small">CURRENT</div><h2>#${S.queue.current}</h2></div><div class="card muted"><div class="small">AHEAD</div><h2>${Math.max(0,x.token-S.queue.current)}</h2></div></div><h2>Estimated Wait</h2><div class="token" style="font-size:38px">${mins} min</div><p>Updated automatically from the demo queue.</p><button class="primary big" onclick="simulateNext()">Demo: Call Next Patient</button><button class="secondary big" onclick="setScreen('tv')">Launch TV Mode</button></div>`;
}
function operatorView(){
 return `<div class="screen"><div class="row"><button class="back" onclick="setScreen('home')">← Patient</button><button class="back" onclick="setScreen('tv')">TV Mode</button></div><h1>Operator Dashboard</h1><p>Combined offline + online queue. Operator has final token control.</p><div class="card"><div class="kpi"><span>Current Patient No.</span><b>#${S.queue.current}</b></div><div class="kpi"><span>Average consultation</span><b>${S.queue.avg} min</b></div><div class="kpi"><span>Queue</span><b>${S.queue.status}</b></div><button class="primary big" onclick="simulateNext()">Call Next Patient</button></div>${S.pending.length?`<div class="card"><h2>Online Booking Requests</h2>${S.pending.map((p,i)=>`<div class="card muted"><h3>${esc(p.patientName)}</h3><p>${esc(p.complaint||"No complaint")} • ${esc(p.paymentLabel)}</p><button class="primary big" onclick="assignToken(${i})">Assign Next Patient No. #${nextToken()}</button></div>`).join("")}</div>`:"<div class='card'><p>No pending online requests.</p></div>"}<div class="card"><h2>Today's Queue</h2><table><thead><tr><th>Patient No.</th><th>Patient</th><th>Status</th><th>Source</th></tr></thead><tbody>${S.queueRows.map(r=>`<tr><td><b>#${r.token}</b></td><td>${esc(r.name)}<br>${r.age}y<br>${esc(r.complaint)}</td><td>${esc(r.status)}</td><td>${esc(r.source)}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function tvView(){
 return `<div class="tv"><div class="logo">Meri<span>Bari</span> — Live Queue</div><p>${esc(S.doctor.clinic)} • ${esc(S.doctor.name)}</p><h3>NOW SERVING PATIENT</h3><div class="tvnow">#${S.queue.current}</div><h3>NEXT PATIENT</h3><div class="tvnext">#${S.queue.current+1}</div><p>Please wait for your patient number.</p><button class="secondary" onclick="setScreen('operator')">Operator</button></div>`;
}

let confirmationResult = null;
let recaptchaVerifier = null;

function initPhoneAuth(){
  if(recaptchaVerifier) return;
  recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
    size: 'invisible',
    callback: function(){ }
  });
  recaptchaVerifier.render().catch(()=>{});
}

async function sendOtp(){
  const input = document.getElementById("mobile");
  const mobile = (input?.value || "").replace(/\D/g,"");
  if(mobile.length !== 10) return alert("Enter a valid 10-digit mobile number.");

  try{
    initPhoneAuth();
    const phoneNumber = "+91" + mobile;
    confirmationResult = await firebase.auth().signInWithPhoneNumber(phoneNumber, recaptchaVerifier);
    S.mobile = mobile;
    S.otpSent = true;
    save();
    setScreen('otp');
  }catch(err){
    console.error(err);
    alert(err.message || "OTP could not be sent. Check Firebase Phone Authentication and authorized domains.");
    if(recaptchaVerifier){
      try{ recaptchaVerifier.clear(); }catch(e){}
      recaptchaVerifier = null;
    }
  }
}

async function verifyOtp(){
  const code = (document.getElementById("otp")?.value || "").trim();
  if(!confirmationResult) return alert("Please request OTP first.");
  if(code.length !== 6) return alert("Enter the 6-digit OTP.");

  try{
    const result = await confirmationResult.confirm(code);
    const user = result.user;
    S.logged = true;
    S.uid = user.uid;
    S.mobile = (user.phoneNumber || S.mobile || "").replace("+91","");
    localStorage.setItem("meribari_uid", user.uid);
    save();
    await loadPatients();
    setScreen('selectPatient');
  }catch(err){
    console.error(err);
    alert("Invalid OTP. Please try again.");
  }
}
else alert("Demo OTP is 123456")}
function choosePatient(id){S.selectedPatient=id;setScreen('home')}
function addPatient(){const p={id:"p"+Date.now(),name:document.getElementById("rel").value||"Family",fullName:document.getElementById("pf").value,age:+document.getElementById("pa").value||0,gender:document.getElementById("pg").value,mobile:document.getElementById("pm").value,complaint:document.getElementById("pc").value};if(!p.fullName)return alert("Enter patient name");S.patients.push(p);S.selectedPatient=p.id;setScreen('home')}
function choosePayment(type){S.payment=type;setScreen('payment')}
function simulatePayment(){
 const p=selected();
 S.appointment={id:"a"+Date.now(),patientId:p.id,token:null,status:"Waiting for Token Assignment",paymentMethod:S.payment,paymentStatus:"Paid",createdAt:Date.now()};
 S.pending.push({appointmentId:S.appointment.id,patientName:p.fullName,complaint:p.complaint,paymentLabel:S.payment==="online"?"Online Consultation Paid":"₹"+S.doctor.serviceFee+" Service Fee Paid — Consultation Cash"});
 save();setScreen('waiting')
}
function nextToken(){return Math.max(S.queue.current+1,...S.queueRows.map(r=>r.token+1))}
function assignToken(i){
 const p=S.pending[i], token=nextToken();
 if(!p)return;
 const ap=S.appointment&&S.appointment.id===p.appointmentId?S.appointment:null;
 if(ap){ap.token=token;ap.status="Waiting"}
 const pat=S.patients.find(x=>x.fullName===p.patientName);
 S.queueRows.push({token,name:p.patientName,age:pat?.age||0,complaint:p.complaint||"",status:"Waiting",source:"ClinicQ"});
 S.pending.splice(i,1);save();alert("Patient No. #"+token+" assigned by operator.");render()
}
function simulateNext(){
 if(S.queue.current<999)S.queue.current++;
 S.queueRows=S.queueRows.map(r=>r.token===S.queue.current?{...r,status:"Current"}:r.token<S.queue.current?{...r,status:"Completed"}:r);
 const reachedMyToken=!!(S.appointment?.token && S.queue.current===S.appointment.token);
 if(S.appointment?.token && S.queue.current>=S.appointment.token)S.appointment.status="Current";
 save();render();
 // When the patient's token is called, immediately show the ClinicQ feedback screen.
 if(reachedMyToken && !sessionStorage.getItem("clinicQFeedbackShown-"+S.appointment.id)){
   sessionStorage.setItem("clinicQFeedbackShown-"+S.appointment.id,"1");
   setTimeout(()=>clinicQShowPostConsultationFeedback(S.appointment.id),250);
 }
}
function filterDoctors(){/* single demo doctor; search UI intentionally simple */}
function emergency(){alert("Emergency contact is Admin-configured in production. For an emergency, use appropriate emergency medical services/facility.")}
function switchRole(){const r=prompt("Enter role: patient / operator / tv","patient");if(r==="operator")setScreen("operator");else if(r==="tv")setScreen("tv");else setScreen("home")}
function resetDemo(){if(confirm("Reset ClinicQ demo?")){localStorage.removeItem(KEY);S=load();render()}}
setInterval(()=>{if(S.screen==="token"||S.screen==="operator"||S.screen==="tv"){S=load();render()}},2000);
render();
</script>

<div id="clinicQFeedbackModal" class="feedback-modal hidden" role="dialog" aria-modal="true">
 <div class="feedback-card">
  <button class="feedback-close" onclick="clinicQCloseFeedback()">×</button>
  <div class="feedback-icon">✓</div>
  <h2>How was your MeriBari experience?</h2>
  <p class="feedback-muted">क्या आपका नंबर समय पर आया?</p>
  <div class="feedback-options">
   <button class="feedback-option" data-v="on_time" onclick="clinicQPickWait('on_time',this)">🟢 <span><b>हाँ, मेरा नंबर जल्दी आ गया</b><small>My number came on time</small></span></button>
   <button class="feedback-option" data-v="slight_wait" onclick="clinicQPickWait('slight_wait',this)">🟡 <span><b>थोड़ा इंतज़ार करना पड़ा</b><small>I had to wait a little</small></span></button>
   <button class="feedback-option" data-v="long_wait" onclick="clinicQPickWait('long_wait',this)">🔴 <span><b>काफी इंतज़ार करना पड़ा</b><small>I had to wait a lot</small></span></button>
  </div>
  <p class="feedback-muted">क्या MeriBari की वजह से आपको clinic में कम इंतज़ार करना पड़ा?</p>
  <div class="feedback-mini">
   <button onclick="clinicQPickReduced('yes',this)">👍 Yes</button><button onclick="clinicQPickReduced('somewhat',this)">😐 Somewhat</button><button onclick="clinicQPickReduced('no',this)">👎 No</button>
  </div>
  <textarea id="clinicQFeedbackComment" class="feedback-comment" placeholder="अपना अनुभव बताएं (Optional)"></textarea>
  <button class="feedback-primary" onclick="clinicQSubmitFeedback()">Submit Feedback</button>
 </div>
</div>
<div id="clinicQFeedbackThanks" class="feedback-modal hidden"><div class="feedback-card feedback-thanks"><div class="feedback-icon">❤️</div><h2>Thank you for your feedback!</h2><p>Your feedback helps MeriBari improve the waiting experience for everyone.</p><button class="feedback-primary" onclick="document.getElementById('clinicQFeedbackThanks').classList.add('hidden')">Done</button></div></div>

<script>
let clinicQFeedbackState={wait:null,reduced:null,appointmentId:null};
function clinicQShowPostConsultationFeedback(appointmentId){clinicQFeedbackState={wait:null,reduced:null,appointmentId:appointmentId||null};document.querySelectorAll('.feedback-option,.feedback-mini button').forEach(x=>x.classList.remove('selected'));document.getElementById('clinicQFeedbackComment').value='';document.getElementById('clinicQFeedbackModal').classList.remove('hidden')}
function clinicQCloseFeedback(){document.getElementById('clinicQFeedbackModal').classList.add('hidden')}
function clinicQPickWait(v,b){clinicQFeedbackState.wait=v;document.querySelectorAll('.feedback-option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}
function clinicQPickReduced(v,b){clinicQFeedbackState.reduced=v;document.querySelectorAll('.feedback-mini button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}
function clinicQSubmitFeedback(){if(!clinicQFeedbackState.wait){alert('Please select your waiting experience.');return}const a=JSON.parse(localStorage.getItem('clinicQFeedback')||'[]');a.push({id:'FB-'+Date.now(),appointmentId:clinicQFeedbackState.appointmentId,waitExperience:clinicQFeedbackState.wait,reducedWait:clinicQFeedbackState.reduced,comment:document.getElementById('clinicQFeedbackComment').value.trim(),createdAt:new Date().toISOString()});localStorage.setItem('clinicQFeedback',JSON.stringify(a));clinicQCloseFeedback();document.getElementById('clinicQFeedbackThanks').classList.remove('hidden')}
</script>
