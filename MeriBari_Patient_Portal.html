<div id="connbar" class="connbar hidden">⚠ Firebase not configured yet — see FIREBASE_SETUP_NOTES.md</div>

<!-- Firebase SDK (compat build — works with plain <script> tags, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

<script>
/* =========================================================
   1) PASTE YOUR FIREBASE CONFIG HERE (from Firebase console)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBL9PzyO4B86JUcKsskF3xnvxwwecuoN8U",
  authDomain: "meribari.firebaseapp.com",
  projectId: "meribari",
  storageBucket: "meribari.firebasestorage.app",
  messagingSenderId: "624386528748",
  appId: "1:624386528748:web:702f9daf1c5ea1199b5cc9",
  measurementId: "G-QRV0D6Q847"
};

let fb = { ready:false };
try{
  if(firebaseConfig.apiKey!=="REPLACE_ME"){
    firebase.initializeApp(firebaseConfig);
    fb.db = firebase.firestore();
    fb.auth = firebase.auth();
    fb.ready = true;
  } else {
    document.getElementById("connbar").classList.remove("hidden");
  }
}catch(e){ console.error("Firebase init failed:", e); document.getElementById("connbar").classList.remove("hidden"); }

/* =========================================================
   2) LOCAL UI STATE (screen navigation only — NOT app data)
   ========================================================= */
let selectedDoctorId = null; // set when the patient picks a doctor from the list
let S = {
  screen:"splash", lang:"en",
  authUser:null, // set by Firebase Auth once phone login succeeds — replaces the old fake demo ID
  loginPhone:"", confirmationResult:null, loginErr:"", otpErr:"",
  patients:[], selectedPatientId:null,
  doctor:null, doctorsList:[], queueLive:null,
  appointment:null,
  unsubQueue:null, unsubAppointment:null
};
function uid(){ return S.authUser ? S.authUser.uid : null; }

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function setScreen(x){ S.screen=x; render(); }
function selectedPatient(){ return S.patients.find(p=>p.id===S.selectedPatientId) || null; }
function waitMinutes(token){ if(!S.queueLive) return null; return Math.max(0,(token-S.queueLive.currentToken))*(S.doctor?.avgConsultationMinutes||5); }

/* =========================================================
   3) FIRESTORE DATA FUNCTIONS
   ========================================================= */

// Load doctor doc once (fee/hours/etc rarely change)
async function loadDoctor(){
  if(!fb.ready || !selectedDoctorId) return;
  const doc = await fb.db.collection("doctors").doc(selectedDoctorId).get();
  S.doctor = doc.exists ? doc.data() : null;
}

// Fetch the list of doctors patients can choose from
async function loadDoctorsList(){
  if(!fb.ready) return;
  const snap = await fb.db.collection("doctors").where("isActive","==",true).get();
  S.doctorsList = snap.docs.map(d=>({id:d.id, ...d.data()}));
}

// LIVE listener on queue/{doctorId} — this is what makes token tracking real-time
function listenQueue(){
  if(!fb.ready || !selectedDoctorId) return;
  if(S.unsubQueue) S.unsubQueue();
  S.unsubQueue = fb.db.collection("queue").doc(selectedDoctorId).onSnapshot(doc=>{
    S.queueLive = doc.exists ? doc.data() : {currentToken:0,status:"OPEN"};
    maybeNotifyTurn();
    if(S.screen==="token" || S.screen==="home") render();
  });
}

// LIVE listener on this patient's active appointment (so tokenNumber appears the moment operator assigns it)
function listenAppointment(appointmentId){
  if(!fb.ready) return;
  saveAppointmentForPatient(S.selectedPatientId, appointmentId);
  if(S.unsubAppointment) S.unsubAppointment();
  S.unsubAppointment = fb.db.collection("appointments").doc(appointmentId).onSnapshot(doc=>{
    S.appointment = doc.exists ? {id:doc.id, ...doc.data()} : null;
    maybeNotifyTurn();
    render();
  });
}

// Tracks each family patient's own active appointment separately: { patientId: appointmentId }
function getAppointmentMap(){
  try{ return JSON.parse(localStorage.getItem("clinicq_appointments")||"{}"); }catch(e){ return {}; }
}
function saveAppointmentForPatient(patientId, appointmentId){
  if(!patientId) return;
  const map = getAppointmentMap();
  map[patientId] = appointmentId;
  localStorage.setItem("clinicq_appointments", JSON.stringify(map));
}
function clearAppointmentForPatient(patientId){
  const map = getAppointmentMap();
  delete map[patientId];
  localStorage.setItem("clinicq_appointments", JSON.stringify(map));
}

// On app start / patient switch, resume tracking THIS patient's own booked appointment (if any)
async function resumeSavedAppointment(){
  if(S.unsubAppointment){ S.unsubAppointment(); S.unsubAppointment=null; }
  S.appointment = null;
  const map = getAppointmentMap();
  const savedId = map[S.selectedPatientId];
  if(!savedId || !fb.ready) return;
  const doc = await fb.db.collection("appointments").doc(savedId).get();
  if(!doc.exists){ clearAppointmentForPatient(S.selectedPatientId); return; }
  const data = doc.data();
  if(["completed","cancelled","no_show"].includes(data.status)){ clearAppointmentForPatient(S.selectedPatientId); return; }
  selectedDoctorId = data.doctorId;
  await loadDoctor();
  listenQueue();
  listenAppointment(savedId);
}

async function loadPatients(){
  if(!fb.ready){ S.patients=[]; return; }
  const snap = await fb.db.collection("users").doc(uid()).collection("patients").get();
  S.patients = snap.docs.map(d=>({id:d.id, ...d.data()}));
}

async function addPatientToFirestore(p){
  const ref = await fb.db.collection("users").doc(uid()).collection("patients").add(p);
  return ref.id;
}

// Creates the appointment doc. tokenNumber is intentionally null — operator assigns it later.
async function createAppointment({patient, paymentType, amountPaid}){
  const data = {
    userId:uid(), patientId:patient.id, patientName:patient.fullName, patientAge:patient.age,
    complaint:patient.complaint||"", doctorId:selectedDoctorId, patientMobile:patient.mobile||"",
    paymentType, amountPaid, paymentStatus:"verified", paymentRef:"DEMO-"+Date.now(),
    tokenNumber:null, status:"waiting_for_token", source:"online",
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  const ref = await fb.db.collection("appointments").add(data);
  return ref.id;
}

/* =========================================================
   4) SCREENS
   ========================================================= */
function header(title=""){return `<header class="mb-header"><div class="mb-logo">Meri<span>Bari</span></div>
<div style="display:flex;align-items:center;gap:10px">
${title?`<div class="small" style="font-weight:700">${esc(title)}</div>`:""}
<button onclick="setScreen('profile')" style="background:none;padding:8px;color:var(--dark)" aria-label="Profile menu">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>
</button></div></header>`}

const ICONS = {
  home:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>',
  search:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  ticket:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 012-2h14a2 2 0 012 2v2a2 2 0 000 4v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2a2 2 0 000-4V8z"/><path d="M13 6v12" stroke-dasharray="2 3"/></svg>'
};
function nav(active){
  const near = S.appointment && S.appointment.tokenNumber && S.queueLive && (S.appointment.tokenNumber - S.queueLive.currentToken) <= 2;
  const item=(key,icon,label,onclick)=>`<button class="${active===key?'active':''}" style="position:relative" onclick="${onclick}">${icon}<span>${label}</span>${key==='token'&&near?'<span class="navDot"></span>':''}</button>`;
  return `<div class="mb-nav">
  ${item('home',ICONS.home,'Home',"goHome()")}
  ${item('doctors',ICONS.search,'Find Doctor',"goDoctorsList()")}
  ${item('token',ICONS.ticket,'My Token',"setScreen('token')")}
  </div>`;
}

async function goHome(){
  await resumeSavedAppointment();
  setScreen("home");
}
async function goDoctorsList(){
  await loadDoctorsList();
  setScreen("doctorsList");
}
async function chooseDoctor(id){
  selectedDoctorId = id;
  await loadDoctor();
  listenQueue();
  setScreen("doctor");
}

// Browser notification (reminder) — works only while this browser/tab has permission granted.
// This is not a native phone alarm, but shows an alert + sound similar to one.
let notifiedTokens = new Set();
function requestNotifyPermission(){
  if(!("Notification" in window)){ alert("Notifications not supported on this browser."); return; }
  Notification.requestPermission().then(p=>{ render(); });
}
function maybeNotifyTurn(){
  if(!S.appointment || !S.appointment.tokenNumber || !S.queueLive) return;
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  const ahead = S.appointment.tokenNumber - S.queueLive.currentToken;
  const key = S.appointment.id+"_"+S.appointment.tokenNumber;
  if(ahead<=2 && ahead>=0 && !notifiedTokens.has(key)){
    notifiedTokens.add(key);
    new Notification("MeriBari — Your turn is approaching", {
      body: `Token #${S.appointment.tokenNumber} — Current token #${S.queueLive.currentToken}. Please start heading to the clinic.`
    });
  }
}

function render(){
  const a = document.getElementById("app");
  let html = "";
  if(S.screen==="splash") html = splashView();
  else if(S.screen==="login") html = loginView();
  else if(S.screen==="otp") html = otpView();
  else if(S.screen==="selectPatient") html = selectPatientView();
  else if(S.screen==="addPatient") html = addPatientView();
  else if(S.screen==="home") html = homeView();
  else if(S.screen==="doctorsList") html = doctorsListView();
  else if(S.screen==="doctor") html = doctorView();
  else if(S.screen==="book") html = bookView();
  else if(S.screen==="payment") html = paymentView();
  else if(S.screen==="waiting") html = waitingView();
  else if(S.screen==="token") html = tokenView();
  else if(S.screen==="profile") html = profileView();
  a.innerHTML = `<div class="mb-shell">${html}</div>`;
}

function splashView(){
  return `<div class="mb-splash">
  <div class="mb-icon">⚕</div>
  <div class="mb-logo">Meri<span>Bari</span></div>
  <p><b>अब इंतज़ार हुआ खत्म, सीधे घर से पहुँचें डॉक्टर के पास।</b><br>No More Waiting. Reach Your Doctor from Home at the Right Time.</p>
  <p>लाइन में नहीं, घर से करें इंतज़ार।<br><b>Don't Wait in Line, Wait from Home.</b></p>
  <button class="mb-primary" onclick="startApp()">Get Started</button></div>`;
}
async function startApp(){
  if(S.authUser){ await afterLogin(); return; }
  setScreen("login");
}

/* =========================================================
   PHONE LOGIN (real Firebase Phone Auth OTP)
   ========================================================= */
let recaptchaVerifier = null;
function getRecaptcha(){
  if(!recaptchaVerifier){
    recaptchaVerifier = new firebase.auth.RecaptchaVerifier("recaptcha-container", { size:"invisible" });
  }
  return recaptchaVerifier;
}

function loginView(){
  return `<div class="mb-screen">
  <h1>Login with Mobile Number</h1>
  <p>We'll send a one-time code (OTP) to verify your number.</p>
  <label>Mobile Number</label>
  <div style="display:flex;gap:8px">
    <div class="mb-input" style="width:64px;text-align:center;flex:none">+91</div>
    <input class="mb-input" id="loginPhoneInput" type="tel" maxlength="10" placeholder="10-digit mobile number" value="${esc(S.loginPhone)}">
  </div>
  ${S.loginErr?`<p style="color:#b42318">${esc(S.loginErr)}</p>`:""}
  <button class="mb-primary" style="margin-top:14px" onclick="sendOtp()">Send OTP</button>
  </div>`;
}

async function sendOtp(){
  const num = document.getElementById("loginPhoneInput").value.trim();
  S.loginErr = "";
  if(!/^\d{10}$/.test(num)){ S.loginErr = "Enter a valid 10-digit mobile number."; render(); return; }
  if(!fb.ready){ S.loginErr = "Firebase not connected."; render(); return; }
  S.loginPhone = num;
  try{
    const fullNumber = "+91"+num;
    S.confirmationResult = await fb.auth.signInWithPhoneNumber(fullNumber, getRecaptcha());
    S.otpErr = "";
    setScreen("otp");
  }catch(e){
    console.error(e);
    S.loginErr = "Could not send OTP: " + e.message;
    render();
  }
}

function otpView(){
  return `<div class="mb-screen">
  <h1>Verify OTP</h1>
  <p>Enter the 6-digit code sent to +91 ${esc(S.loginPhone)}</p>
  <input class="mb-input" id="otpInput" type="tel" maxlength="6" placeholder="6-digit OTP" style="text-align:center;font-size:22px;letter-spacing:6px">
  ${S.otpErr?`<p style="color:#b42318">${esc(S.otpErr)}</p>`:""}
  <button class="mb-primary" style="margin-top:14px" onclick="verifyOtp()">Verify & Continue</button>
  <button class="mb-outline" style="margin-top:10px" onclick="setScreen('login')">Change Number</button>
  </div>`;
}

async function verifyOtp(){
  const code = document.getElementById("otpInput").value.trim();
  S.otpErr = "";
  if(!/^\d{6}$/.test(code)){ S.otpErr = "Enter the 6-digit code."; render(); return; }
  try{
    await S.confirmationResult.confirm(code);
    // onAuthStateChanged (below) will set S.authUser and call afterLogin()
  }catch(e){
    console.error(e);
    S.otpErr = "Incorrect code. Please try again.";
    render();
  }
}

async function afterLogin(){
  await loadPatients();
  setScreen(S.patients.length ? "selectPatient" : "addPatient");
}

if(fb.ready){
  fb.auth.onAuthStateChanged(user=>{
    S.authUser = user;
    if(user && (S.screen==="splash" || S.screen==="login" || S.screen==="otp")){
      afterLogin();
    } else if(!user){
      render();
    }
  });
}

function selectPatientView(){
  return `<div class="mb-screen"><h1>Who is the appointment for?</h1>
  <p class="small">Tap to select • Press & hold to delete</p>
  ${S.patients.map(p=>`<div class="mb-card" style="cursor:pointer"
    onmousedown="patientHoldStart('${p.id}')" onmouseup="patientHoldEnd()" onmouseleave="patientHoldEnd()"
    ontouchstart="patientHoldStart('${p.id}')" ontouchend="patientHoldEnd()"
    onclick="patientCardClick('${p.id}')">
    <b>${esc(p.relation)} – ${esc(p.fullName)}</b><p>Age ${p.age} • ${esc(p.gender)}</p></div>`).join("")}
  <button class="mb-secondary" onclick="setScreen('addPatient')">+ Add New Patient</button></div>`;
}
let longPressTimer=null, longPressFired=false;
function patientHoldStart(id){
  longPressFired=false;
  longPressTimer=setTimeout(()=>{ longPressFired=true; confirmDeletePatient(id); }, 600);
}
function patientHoldEnd(){ clearTimeout(longPressTimer); }
function patientCardClick(id){
  if(longPressFired){ longPressFired=false; return; }
  choosePatient(id);
}
async function confirmDeletePatient(id){
  const p = S.patients.find(x=>x.id===id);
  if(!confirm(`Delete patient "${p?.fullName||''}"?\nThis cannot be undone.`)) return;
  await fb.db.collection("users").doc(uid()).collection("patients").doc(id).delete();
  S.patients = S.patients.filter(x=>x.id!==id);
  clearAppointmentForPatient(id);
  if(S.selectedPatientId===id) S.selectedPatientId=null;
  render();
}
function choosePatient(id){ S.selectedPatientId=id; goHome(); }

  return `<div class="mb-screen"><h1>Add Patient</h1>

  <label>Full Name</label><input class="mb-input" id="pf">
  <label>Age</label><input class="mb-input" id="pa" type="number">
  <label>Gender</label><select class="mb-input" id="pg"><option>Male</option><option>Female</option><option>Other</option></select>
  <label>Mobile Number</label><input class="mb-input" id="pm">
  <label>Complaint / Problem</label><textarea class="mb-input" id="pc"></textarea>

}
async function submitAddPatient(){
  const p = {relation:document.getElementById("rel").value||"Myself", fullName:document.getElementById("pf").value,
    age:+document.getElementById("pa").value||0, gender:document.getElementById("pg").value,
    mobile:document.getElementById("pm").value, complaint:document.getElementById("pc").value};
  if(!p.fullName) return alert("Enter patient name");
  if(!fb.ready){ alert("Firebase not connected yet — data won't be saved. Add your config at the top of this file first."); return; }

  S.selectedPatientId = id;
  goHome();
}

function homeView(){
  return `${header("Home")}<div class="mb-screen">
  ${S.appointment ? appointmentCard() : `<div class="card center"><p>No active appointment.</p><button class="mb-primary" onclick="goDoctorsList()">Find a Doctor</button></div>`}

}

function appointmentCard(){
  const ap = S.appointment;
  const assigned = !!ap.tokenNumber;
  const near = assigned && S.queueLive && (ap.tokenNumber - S.queueLive.currentToken) <= 2;
  return `<div class="mb-card" style="${assigned?'border:2px solid '+(near?'#b42318':'#18864b'):''}">
  <h3>My Appointment</h3>
  <div class="kpi"><span>Doctor</span><b>${esc(S.doctor?.name||"")}</b></div>
  <div class="kpi"><span>Status</span><span class="tag ${assigned?(near?'dangerTag':''):'warning'}">${assigned ? (near?'Your turn is near!':'Token Assigned — #'+ap.tokenNumber) : esc(ap.status)}</span></div>
  <div class="kpi"><span>Token</span><b>${ap.tokenNumber ?? "Waiting for assignment"}</b></div>
  ${assigned ? `
  <div class="kpi"><span>Current Token (Clinic)</span><span style="display:flex;align-items:center;gap:8px"><span class="mb-live"><span class="mb-live-dot"></span>LIVE</span><b>#${S.queueLive?.currentToken ?? "–"}</b></span></div>
  <div class="kpi"><span>Estimated Wait</span><b>${waitMinutes(ap.tokenNumber)} min</b></div>` : ""}
  <button class="mb-secondary" onclick="setScreen('token')">Track Live Queue</button>
  </div>`;
}

function initials(name){ return (name||"").replace(/^Dr\.?\s*/i,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function parseConsultationHours(workingHours){
  const s = String(workingHours||"").trim();
  const m = s.match(/(\\d{1,2})(?::(\\d{2}))?\\s*(am|pm)\\s*(?:-|to|–|—)\\s*(\\d{1,2})(?::(\\d{2}))?\\s*(am|pm)/i);
  if(!m) return null;
  let sh=+m[1], sm=+(m[2]||0), eh=+m[4], em=+(m[5]||0);
  const sap=m[3].toLowerCase(), eap=m[6].toLowerCase();
  if(sap==="pm" && sh!==12) sh+=12;
  if(sap==="am" && sh===12) sh=0;
  if(eap==="pm" && eh!==12) eh+=12;
  if(eap==="am" && eh===12) eh=0;
  return {start:sh*60+sm,end:eh*60+em};
}
function consultationStatus(doctor){
  const hours = parseConsultationHours(doctor?.workingHours);
  if(!hours) return {known:false,active:true};
  const now = new Date();
  const minutes = now.getHours()*60 + now.getMinutes();
  if(minutes < hours.start) return {known:true,active:false,before:true};
  if(minutes >= hours.end) return {known:true,active:false,after:true};
  return {known:true,active:true};
}
function formatConsultationMessage(doctor){
  const status = consultationStatus(doctor);
  if(status.after) return `Doctor consultation time is over. Consultation time: ${doctor.workingHours}. If you want an appointment, please book for the next available time.`;
  if(status.before) return `Doctor consultation has not started yet. Consultation time: ${doctor.workingHours}. Please book during the consultation time.`;
  return "";
}
function doctorsListView(){
  const q = (S.doctorSearch||"").toLowerCase();
  const filtered = S.doctorsList.filter(d=>!q || (d.name||"").toLowerCase().includes(q) || (d.specialty||"").toLowerCase().includes(q));
  return `${header("Find Doctor")}<div class="mb-screen">
  <input class="mb-input" placeholder="Search by doctor name or specialty" value="${esc(S.doctorSearch||"")}" oninput="S.doctorSearch=this.value;render()" style="margin-bottom:14px">
  ${filtered.map(d=>`<div class="card doctor" style="cursor:pointer" onclick="chooseDoctor('${d.id}')">
  <div class="avatarG">${initials(d.name)}</div>
  <div style="flex:1"><h3 style="margin-bottom:2px">${esc(d.name)}</h3><span class="tag" style="margin:2px 0">${esc(d.specialty)}</span>
  <p class="small" style="margin-top:6px">${esc(d.clinicName)} • Total ₹${(d.consultationFee+d.platformFee)}</p></div></div>`).join("") || `<p>No doctors match your search.</p>`}
  </div>${nav('doctors')}`;
}

function doctorView(){
  if(!S.doctor) return `${header("Find Doctor")}<div class="mb-screen"><p>Loading…</p></div>${nav('doctors')}`;
  const d = S.doctor;
  return `${header("Doctor")}<div class="mb-screen">
  <div class="card doctor">
  <div class="avatarG">${initials(d.name)}</div>
  <div><h3>${esc(d.name)}</h3><span class="tag">${esc(d.specialty)}</span>
  ${(d.qualifications||[]).map(q=>`<div class="small" style="margin-top:4px">${esc(q)}</div>`).join("")}
  <p class="small">${esc(d.experience)}</p></div></div>
  <div class="mb-card">
  <div class="kpi"><span>Clinic</span><b>${esc(d.clinicName)}</b></div>
  <div class="kpi"><span>Hours</span><b>${esc(d.workingHours)}</b></div>
  <div class="kpi"><span>Total Amount</span><b>₹${(d.consultationFee+d.platformFee)}</b></div>
  <div class="kpi"><span>Current Token</span><span style="display:flex;align-items:center;gap:8px"><span class="mb-live"><span class="mb-live-dot"></span>LIVE</span><b>#${S.queueLive?.currentToken ?? "–"}</b></span></div>
  </div>
  ${consultationStatus(d).active ? `<button class="mb-primary" onclick="tryBookAppointment()">Book Appointment</button>` : `<div class="alert" style="margin-top:14px">${esc(formatConsultationMessage(d))}</div><button class="mb-secondary" disabled style="opacity:.55;cursor:not-allowed">Book Appointment</button>`}
  <button class="mb-outline" onclick="emergency()">Emergency Help</button>
  <button class="mb-outline" onclick="window.open('?tv='+selectedDoctorId,'_blank')">📺 Launch TV Mode</button>
  </div>${nav('doctors')}`;
}
function hasActiveAppointment(){
  return S.appointment && S.appointment.doctorId===selectedDoctorId && !["completed","cancelled","no_show"].includes(S.appointment.status);
}
function tryBookAppointment(){
  const consultation = consultationStatus(S.doctor);
  if(consultation.known && !consultation.active){
    alert(formatConsultationMessage(S.doctor));
    return;
  }
  if(hasActiveAppointment()){
    alert("You already have an active appointment with this doctor.\nStatus: "+S.appointment.status+(S.appointment.tokenNumber?"\nToken: #"+S.appointment.tokenNumber:"")+"\n\nGo to 'My Token' to track it.");
    setScreen('token');
    return;
  }
  setScreen('book');
}
function emergency(){ alert("Emergency contact is admin-configured. For real emergencies, contact appropriate emergency medical services."); }

function bookView(){
  if(hasActiveAppointment()){
    return `${header("Already Booked")}<div class="mb-screen"><div class="alert">You already have an active appointment.<br>Status: ${esc(S.appointment.status)}${S.appointment.tokenNumber?"<br>Token: #"+S.appointment.tokenNumber:""}</div>
    <button class="mb-primary" onclick="setScreen('token')">Go to My Token</button></div>${nav('doctors')}`;
  }
  const p = selectedPatient();
  if(!p) return `${header()}<div class="mb-screen"><p>Select a patient first.</p><button class="mb-primary" onclick="setScreen('selectPatient')">Select Patient</button></div>`;
  return `${header("Book Appointment")}<div class="mb-screen">
  <div class="mb-card">
  <div class="kpi"><span>Patient</span><b>${esc(p.fullName)}</b></div>
  <div class="kpi"><span>Doctor</span><b>${esc(S.doctor.name)}</b></div>
  <div class="kpi"><span>Complaint</span><b>${esc(p.complaint||"-")}</b></div>
  </div>
  <h3>Payment Options</h3>
  <button class="mb-primary" onclick="S.payType='online';setScreen('payment')">Pay Consultation Online — ₹${S.doctor.consultationFee+S.doctor.platformFee}</button>
  <button class="mb-secondary" onclick="S.payType='cash';setScreen('payment')">Cash at Clinic (Pay ₹${S.doctor.serviceFee} service fee online)</button>
  </div>${nav('doctors')}`;
}

function paymentView(){
  const d=S.doctor, online = S.payType==="online";
  const amount = online ? (d.consultationFee+d.platformFee) : d.serviceFee;
  return `${header("Payment")}<div class="mb-screen">
  <div class="mb-card">
  ${online ? `<div class="kpi"><span>Total Payable</span><b>₹${amount}</b></div>` :
  `<div class="kpi"><span>Doctor Fee</span><b>₹${d.consultationFee} – Cash at Clinic</b></div><div class="kpi"><span>MeriBari Service Fee</span><b>₹${amount} – Pay Online</b></div>
  <p>${'यह ₹'+d.serviceFee+' शुल्क MeriBari की queue-management service के लिए है — आपको clinic में घंटों इंतज़ार नहीं करना पड़ेगा।'}</p>`}
  </div>
  <button class="mb-primary" onclick="doPayment('${online?'online':'cash_at_clinic'}', ${amount})">Pay Now (Demo) — ₹${amount}</button>
  </div>${nav('doctors')}`;
}

async function doPayment(paymentType, amount){
  if(!fb.ready){ alert("Firebase not connected yet — connect it first to save real appointments."); return; }
  const p = selectedPatient();
  const id = await createAppointment({patient:p, paymentType, amountPaid:amount});
  listenAppointment(id);
  setScreen("waiting");
}

function waitingView(){
  return `${header("Payment Successful")}<div class="mb-screen">
  <div class="success">Payment Successful ✓</div>
  <div class="mb-card">
  <h3>Appointment Request Submitted</h3>
  <p>Your payment has been received. The clinic operator will assign your token number according to the current clinic queue.</p>
  <div class="kpi"><span>Status</span><span class="tag warning">${esc(S.appointment?.status||"waiting_for_token")}</span></div>
  </div>
  <button class="mb-primary" onclick="setScreen('token')">Go to My Token</button>
  </div>${nav('token')}`;
}

async function trackByMobile(){
  const mobile = document.getElementById("trackMobile").value.trim();
  const err = document.getElementById("trackErr");
  err.textContent = "";
  if(!mobile){ err.textContent="Enter mobile number"; return; }
  const snap = await fb.db.collection("appointments").where("patientMobile","==",mobile).get();
  let results = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(a=>!["completed","cancelled","no_show"].includes(a.status));
  if(!results.length){ err.textContent="No active appointment found for this number."; return; }
  results.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  const ap = results[0];
  selectedDoctorId = ap.doctorId;
  await loadDoctor();
  listenQueue();
  listenAppointment(ap.id);
}

function tokenView(){
  if(!S.appointment) return `${header("My Token")}<div class="mb-screen">
  <p>No active appointment yet.</p>
  <div class="mb-card"><h3>Walk-in patient? Track your token</h3>
  <label>Mobile Number</label><input class="mb-input" id="trackMobile" placeholder="Enter mobile number used at clinic">

  <div id="trackErr" class="small" style="color:#b42318;margin-top:8px"></div>
  </div></div>${nav('token')}`;
  const ap = S.appointment, q = S.queueLive;
  const assigned = !!ap.tokenNumber;
  return `${header("My Token")}<div class="mb-screen">
  ${assigned ? `
  <div class="mb-ticket">
    <div class="mb-ticket-top">
      <div class="tokenLabel">Your Token</div>
      <div class="mb-ticket-num">#${ap.tokenNumber}</div>
    </div>
    <div class="mb-ticket-seam"></div>
    <div class="mb-ticket-bottom">
      <div class="kpi"><span>Current Token</span><span style="display:flex;align-items:center;gap:8px"><span class="mb-live"><span class="mb-live-dot"></span>LIVE</span><b>#${q?.currentToken ?? "–"}</b></span></div>
      <div class="kpi"><span>Patients Ahead</span><b>${Math.max(0, ap.tokenNumber-(q?.currentToken||0))}</b></div>
      <div class="kpi"><span>Estimated Wait</span><b>${waitMinutes(ap.tokenNumber)} min</b></div>
    </div>
  </div>
  ${("Notification" in window && Notification.permission!=="granted") ? `<button class="mb-outline" onclick="requestNotifyPermission()">🔔 Enable Turn Reminder</button>` : ""}` : `<div class="alert">Waiting for the clinic operator to assign your token. This screen updates automatically — no need to refresh.</div>`}
  </div>${nav('token')}`;
}

function profileView(){
  const p = selectedPatient();
  return `${header("Profile")}<div class="mb-screen">
  <div class="mb-card"><b>${p?esc(p.fullName):"No patient selected"}</b><p class="small">+91 ${esc(S.loginPhone)}</p></div>
  <button class="mb-outline" onclick="setScreen('selectPatient')">Switch / Add Family Patient</button>
  <button class="mb-danger" style="margin-top:10px" onclick="doLogout()">Logout</button>
  </div>${nav('')}`;
}
function doLogout(){
  if(fb.ready) fb.auth.signOut();
  S.patients=[]; S.selectedPatientId=null; S.appointment=null; S.loginPhone="";
  setScreen("splash");
}

// TV Mode — standalone display for a clinic monitor. Opened via ?tv=<doctorId>, no login/patient flow needed.
let tvDoctor=null, tvQueue={currentToken:0,status:"OPEN"};
function tvView(){
  return `<div class="mb-tv">
  <div class="mb-logo text-white">Meri<span>Bari</span> — Live Queue</div>
  <div class="clinicName">${esc(tvDoctor?.clinicName||"")} • ${esc(tvDoctor?.name||"")}</div>
  <div class="nowLabel">NOW SERVING</div>
  <div class="nowNum">#${tvQueue.currentToken}</div>
  <div class="nextRow"><div class="nextBox"><div class="nextLabel">NEXT</div><div class="nextNum">#${tvQueue.currentToken+1}</div></div></div>
  <div class="tvFooter">Please wait for your token number to be called.</div>
  </div>`;
}
async function initTvMode(doctorId){
  document.getElementById("app").innerHTML = tvView();
  if(!fb.ready) return;
  const doc = await fb.db.collection("doctors").doc(doctorId).get();
  tvDoctor = doc.exists ? doc.data() : null;
  fb.db.collection("queue").doc(doctorId).onSnapshot(d=>{
    tvQueue = d.exists ? d.data() : {currentToken:0,status:"OPEN"};
    document.getElementById("app").innerHTML = tvView();
  });
}

const tvParam = new URLSearchParams(location.search).get("tv");
if(tvParam){
  initTvMode(tvParam);
} else {
  render();
}
